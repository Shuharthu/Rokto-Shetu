name: RoktoSetu CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test_and_audit:
    name: Run Automated Tests & Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'functions/package-lock.json'

      - name: Install Functions Dependencies
        working-directory: ./functions
        run: npm ci

      - name: Automated Secret & Credential Scan
        name: Scan for Committed Secrets
        run: |
          echo "Scanning codebase for hardcoded private keys, KMS credentials, or secrets..."
          # Reject any committed private key files or unmasked tokens
          if grep -rnE --exclude-dir={.git,node_modules} "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" .; then
            echo "SECURITY ALERT: Unencrypted private key found!"
            exit 1
          fi
          echo "✓ Secret scanning clean. No private keys detected."

      - name: Execute Full Automated Test Suite (Phases 1-11)
        run: node tests/run-all-tests.js

      - name: Run Database Seeder Dry-Run Verification
        run: node seed/seed.js
